[package]
name = "minimarket"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0.100"
bytes = "1.10.1"
dashmap = "6.1.0"
futures-util = "0.3.31"
serde = "1.0.228"
serde_json = "1.0.145"
tokio = { version = "1.48", features = ["full"] }
tokio-stream = "0.1.17"
tokio-tungstenite = "0.28.0"
uuid = { version = "1.18.1", features = ["v4"] }

[[bin]]
name = "server"
path = "src/server.rs"

[[bin]]
name = "client"
path = "src/client.rs"
