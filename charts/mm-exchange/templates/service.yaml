apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-server-headless
  labels:
    app: {{ .Release.Name }}-server
spec:
  clusterIP: None
  selector:
    app: {{ .Release.Name }}-server
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
